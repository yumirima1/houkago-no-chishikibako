name: Deploy Observer Room to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The room does not use legacy audio/model archives or private runtime data.
          sparse-checkout: |
            /*
            !/public/audio/
            !/public/backgrounds/
            !/public/exports/
            !/public/jingles/
            !/public/models/
            !/screenshots/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm run lint
      - name: Run isolated regression tests
        run: |
          mkdir -p tmp
          npm run test:kousatsu
      - run: npm run build:pages
      - run: node scripts/verify-pages-artifact.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: research-build-browser
          path: |
            tmp/research-browser
            tmp/research-browser-report
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  verify-public:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the deployed archive
        env:
          PAGES_TEST_URL: https://yumirima1.github.io/houkago-no-chishikibako/
        run: npm run test:pages
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: research-browser
          path: |
            tmp/research-browser
            tmp/research-browser-report
